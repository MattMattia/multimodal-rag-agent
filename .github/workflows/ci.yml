name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check app/ frontend/ tests/ run.py
      - run: mypy app

  test-postgres:
    name: pytest (PostgreSQL + pgvector)
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_multimodal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rag_multimodal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/rag_multimodal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r frontend/requirements.txt
      # Includes the RAG evaluation benchmark tests (tests/test_evaluation.py); no GOOGLE_API_KEY needed (offline fixture).
      - run: python -m pytest -q -p no:cacheprovider

  test-sqlite:
    name: pytest (SQLite fallback)
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: sqlite+aiosqlite:///${{ runner.temp }}/test_rag.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r frontend/requirements.txt
      - run: python -m pytest -q -p no:cacheprovider

  openapi:
    name: OpenAPI contract is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python run.py --export-openapi
      - run: git diff --exit-code docs/openapi.json

  web:
    name: web (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
